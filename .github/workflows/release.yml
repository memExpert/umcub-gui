name: Release

# The program as a Windows folder (zip) and a Linux AppImage. Every build checks itself (--self-test); a tag vX.Y.Z
# (= umcub_gui.__version__) also publishes them as a GitHub release. Run by hand (Actions tab) to try a build.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # The oldest Ubuntu runner: the AppImage carries its libraries and runs on distributions as new or newer
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libgl1
      - run: python -m pip install . "pyinstaller>=6.16"
      - name: The tag is the program's version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: test "v$(python -c 'import umcub_gui; print(umcub_gui.__version__)')" = "$GITHUB_REF_NAME"
      - run: pyinstaller --noconfirm packaging/umcub-gui.spec

      - name: Linux AppImage
        if: runner.os == 'Linux'
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"     # no FUSE on the runner
        run: |
          dist/umcub-gui/umcub-gui --self-test
          curl -sSfL -o appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          name=umcub-gui-$(python -c 'import umcub_gui; print(umcub_gui.__version__)')-linux-x86_64.AppImage
          APPIMAGETOOL=$PWD/appimagetool packaging/appimage.sh dist/umcub-gui "$name"
          ./"$name" --self-test
          mkdir out && mv "$name" out/

      - name: Windows folder
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # a windowed program: no console output, the report goes to a file
          $p = Start-Process dist/umcub-gui/umcub-gui.exe -ArgumentList "--self-test", "report.txt" -Wait -PassThru
          Get-Content report.txt
          if ($p.ExitCode -ne 0) { exit 1 }
          $version = python -c "import umcub_gui; print(umcub_gui.__version__)"
          New-Item -ItemType Directory out
          Compress-Archive dist/umcub-gui "out/umcub-gui-$version-windows-x64.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: umcub-gui-${{ runner.os }}
          path: out/*

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: out
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
