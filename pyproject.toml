[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "umcub-gui"
version = "0.0.1"
description = "Desktop flasher for devices running the umcub bootloader"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
  "PySide6-Essentials>=6.6",   # widgets, core, translations; no WebEngine / Addons
  # The host library of the umcub repository, from the tag's source archive: a git URL would clone every
  # submodule of umcub (MCUboot, mbedTLS, ST drivers), and on Windows some of their paths are too long.
  "umcub @ https://github.com/memExpert/umcub/archive/refs/tags/v0.5.0.zip#subdirectory=tools/host",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-qt>=4.4"]

[project.gui-scripts]
umcub-gui = "umcub_gui.__main__:main"

[tool.setuptools.packages.find]
include = ["umcub_gui*"]

[tool.setuptools.package-data]
umcub_gui = ["translations/*.qm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
